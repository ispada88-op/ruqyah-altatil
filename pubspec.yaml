name: roqia_altatil
description: "Roqia Al-Ta'til is a serene Islamic app designed to bring tranquility to your daily life, offering written and audio Roqia, along with a daily Dhikr counter in a beautifully minimalist interface."
publish_to: "none"
version: 1.1.0+18

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  just_audio: ^0.10.5
  just_audio_background: ^0.0.1-beta.13   # background playback (lock screen + notification)
  audio_session: ^0.2.2
  shared_preferences: ^2.0.0
  flutter_animate: ^4.0.0
  url_launcher: ^6.0.0

  # ── Notifications (dhikr reminders) ──
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  permission_handler: ^11.3.0

  # ── New features ──
  share_plus: ^10.1.2          # share verses
  in_app_review: ^2.0.10       # in-app rating
  package_info_plus: ^9.0.1    # version for whats-new sheet
  flutter_timezone: ^5.1.0
  adhan: ^2.0.0+1              # prayer times (offline astronomy)
  geolocator: ^14.0.2          # optional GPS for prayer times / qibla
  flutter_compass: ^0.8.1      # qibla compass


dev_dependencies:
  flutter_test:
    sdk: flutter
  crypto: ^3.0.3            # SHA-256 pin of the bundled Quran text (tests only)
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1   # native splash screen

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/
    # Bundled Google Fonts (offline Quran text on first launch; no request to
    # fonts.gstatic.com). Names MUST follow google_fonts' Family-Variant.ttf.
    # Any weight not bundled here is still fetched at runtime as before.
    - assets/google_fonts/
    # Full Quran — King Fahd Complex (KFGQPC) Hafs v0.18 data, verbatim.
    # Never edit by hand: test/quran_asset_test.dart pins its SHA-256.
    - assets/quran/
    # KFGQPC font EULA (must ship with the font).
    - assets/fonts/kfgqpc/KFGQPC-EULA.txt
    # Madinah Mushaf page layout (604 pages) + its 47 page fonts (one glyph per
    # word, byte-identical to KFGQPC «Mushaf Publisher»). Loaded lazily with
    # FontLoader (NOT declared under `fonts:`) — see MushafPagesRepository.
    - assets/fonts/qcf4/

  fonts:
    # «KFGQPC HAFS Uthmanic Script» v0.18 — the Madinah Mushaf font. Byte-identical
    # to the official file (EULA: use/copy/distribute free; NEVER modify, subset,
    # convert or sell it). SHA-256 pinned in test/quran_asset_test.dart.
    - family: KFGQPCHafs
      fonts:
        - asset: assets/fonts/kfgqpc/hafs.18.ttf

flutter_launcher_icons:
  android: true
  ios: false   # keep iOS icons untouched (app already on App Store)
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#05696A"
  adaptive_icon_foreground: assets/icons/app_icon_fg.png
  min_sdk_android: 23
  web:
    generate: false

flutter_native_splash:
  color: "#006B6B"
  image: assets/icons/dreamflow_icon.jpg
  android_12:
    color: "#006B6B"
    image: assets/icons/dreamflow_icon.jpg
  ios: true
  android: true
  fullscreen: false
