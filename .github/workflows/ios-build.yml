# بناء iOS من GitHub (بدون Mac) — يحتاج تشغيل على runner بنظام macOS
# الناتج: تطبيق غير موقع (للتجربة) أو IPA إذا أضفت التوقيع عبر Secrets

name: iOS Build

on:
  workflow_dispatch:  # manual only — Codemagic هو خط النشر الرسمي

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Pub get
        run: flutter pub get

      - name: Generate icons and splash
        run: |
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Install pods
        run: cd ios && pod install && cd ..

      - name: Build iOS (no code sign)
        run: flutter build ios --release --no-codesign

      - name: Upload build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
