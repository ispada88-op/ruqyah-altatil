# =============================================================================
# iOS Release → TestFlight (GitHub Actions, no Mac needed)
# Signing is fully automatic via codemagic-cli-tools + App Store Connect API:
#   - Creates/fetches the Apple Distribution certificate & provisioning profile
#   - Builds the IPA and uploads it to TestFlight
#
# Required repo secrets:
#   APP_STORE_CONNECT_KEY_ID      — API Key ID (App Store Connect → Integrations)
#   APP_STORE_CONNECT_ISSUER_ID   — Issuer ID (same page)
#   APP_STORE_CONNECT_PRIVATE_KEY — contents of the downloaded .p8 file
#   CERTIFICATE_PRIVATE_KEY       — RSA private key (PEM) for the signing cert
#
# Supply-chain hardening (2026-11-03):
#   - every action pinned to a commit SHA
#   - codemagic-cli-tools installed from a version + hash locked file (ci/codemagic-requirements.txt)
#   - signing secrets are given ONLY to the steps that need them; `flutter pub get`, analyze,
#     tests and the build (which run third-party package code) never see them
# =============================================================================

name: iOS Release (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ios-release:
    name: Build & upload to TestFlight
    # macos-26: default Xcode 26.x — Apple requires iOS 26 SDK for App Store uploads
    runs-on: macos-26
    timeout-minutes: 90

    env:
      BUNDLE_ID: com.ruqyah.altatil
      WIDGET_BUNDLE_ID: com.ruqyah.altatil.widget

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install codemagic-cli-tools (version + hash locked)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/cm"
          "$RUNNER_TEMP/cm/bin/pip" install --no-input --require-hashes -r ci/codemagic-requirements.txt
          echo "$RUNNER_TEMP/cm/bin" >> "$GITHUB_PATH"

      - name: Quality gate (never upload a build that fails analyze/tests)
        run: |
          flutter pub get
          python3 scripts/verify_quran.py
          flutter analyze --no-fatal-infos
          flutter test

      - name: Initialize keychain
        run: keychain initialize

      - name: Fetch signing files (auto-create certificate & profiles)
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          # امتداد الودجت (ios/PrayerWidget) له معرّف وملف توقيع خاصان.
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Build IPA
        run: |
          flutter build ipa --release \
            --export-options-plist "$HOME/export_options.plist"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          app-store-connect publish \
            --path "build/ios/ipa/*.ipa"

      - name: Upload IPA artifact (backup)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: ignore
